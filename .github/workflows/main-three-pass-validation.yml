name: Main three-pass validation

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: main-three-pass-validation
  cancel-in-progress: false

jobs:
  validate:
    name: Full validation pass 1, 2, and 3
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run three complete validation passes
        shell: bash
        run: |
          set -euo pipefail
          for pass in 1 2 3; do
            echo "::group::PASS ${pass}/3 — repository lint"
            pnpm lint
            echo "::endgroup::"

            echo "::group::PASS ${pass}/3 — automated tests"
            pnpm test
            echo "::endgroup::"

            echo "::group::PASS ${pass}/3 — production build"
            pnpm build
            echo "::endgroup::"
          done
