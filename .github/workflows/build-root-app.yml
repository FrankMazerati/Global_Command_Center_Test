name: Build 003 - Global Command Center
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: true
jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Install dependencies
        run: bun install
      - name: Apply repository formatting
        run: bun run lint -- --fix
      - name: Lint
        run: bun run lint
      - name: Tests
        run: bun run test
      - name: Production build
        run: bun run build
      - name: Verify publishable site output
        run: |
          echo "Build output directories:"
          find .output -maxdepth 3 -type f | head -80
          test -f .output/public/index.html
      - name: Upload website for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
