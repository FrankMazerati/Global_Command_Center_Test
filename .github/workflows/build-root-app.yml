name: Build 004 - Global Command Center
on:
  push:
    branches: [main, integrate/maximus-command-center]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: true
jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout selected ref
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Install dependencies
        run: bun install
      - name: Apply repository formatting
        run: bun run lint -- --fix
      - name: Lint
        run: bun run lint
      - name: Tests
        run: bun run test
      - name: Production build
        run: bun run build
      - name: Prepare GitHub Pages fallback
        run: |
          echo "Generated static pages:"
          find .output/public -maxdepth 3 -type f | sort | head -100
          test -f .output/public/index.html
          test -f .output/public/login/index.html
          cp .output/public/index.html .output/public/404.html
          touch .output/public/.nojekyll
      - name: Upload website for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
