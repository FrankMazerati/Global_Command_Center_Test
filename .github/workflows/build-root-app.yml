name: Build 005 - Global Command Center
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  quality-checks:
    name: "1. Lint and Test"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install
      - name: Repository lint (formatting rule excluded)
        run: 'bun run lint -- --rule "prettier/prettier: off"'
      - name: Automated tests
        run: "bun run test"
      - name: Report formatting drift (non-blocking)
        shell: bash
        run: |
          if bunx prettier --check .; then
            echo "Formatting check: clean." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Formatting drift detected. Lint, tests, build, and deployment remain independently enforced."
            echo "Formatting check: drift detected (reported as a warning; not a blocking failure)." >> "$GITHUB_STEP_SUMMARY"
          fi

  production-build:
    name: "2. Production Build"
    runs-on: ubuntu-latest
    needs: quality-checks
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install
      - name: Build production site
        run: "bun run build"
      - name: Upload built site
        uses: actions/upload-artifact@v4
        with:
          name: command-center-site
          path: .output/public
          if-no-files-found: error
          retention-days: 1

  deploy-preview:
    name: "3. Deploy Preview"
    runs-on: ubuntu-latest
    needs: production-build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Download built site
        uses: actions/download-artifact@v4
        with:
          name: command-center-site
          path: site
      - name: Prepare GitHub Pages fallback
        run: |
          test -f site/index.html
          test -f site/login/index.html
          cp site/index.html site/404.html
          touch site/.nojekyll
      - name: Upload website for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Publish three workflow links
        if: success()
        env:
          PREVIEW_URL: ${{ steps.deployment.outputs.page_url }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          {
            echo "# Command Center Build #${RUN_NUMBER}"
            echo ""
            echo "## 1. Preview the deployed build"
            echo "[Open Command Center](${PREVIEW_URL})"
            echo ""
            echo "## 2. Open this workflow"
            echo "[View all three workflow checks](https://github.com/${REPOSITORY}/actions/runs/${RUN_ID})"
            echo ""
            echo "## 3. Inspect the exact commit"
            echo "[View commit ${COMMIT_SHA}](https://github.com/${REPOSITORY}/commit/${COMMIT_SHA})"
          } >> "$GITHUB_STEP_SUMMARY"
