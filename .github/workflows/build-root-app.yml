name: Build 004 - Global Command Center
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Install dependencies
        run: bun install
      - name: Apply repository formatting
        run: bun run lint -- --fix
      - name: Lint
        run: bun run lint
      - name: Tests
        run: bun run test
      - name: Production build
        run: bun run build
      - name: Prepare GitHub Pages fallback
        run: |
          echo "Generated static pages:"
          find .output/public -maxdepth 3 -type f | sort | head -100
          test -f .output/public/index.html
          test -f .output/public/login/index.html
          cp .output/public/index.html .output/public/404.html
          touch .output/public/.nojekyll
      - name: Upload website for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Publish build preview links
        if: success()
        env:
          PREVIEW_URL: ${{ steps.deployment.outputs.page_url }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          {
            echo "## Build preview"
            echo ""
            echo "**Build:** #${RUN_NUMBER}"
            echo ""
            echo "[Open the deployed Command Center preview](${PREVIEW_URL})"
            echo ""
            echo "[Open this exact GitHub Actions workflow run](https://github.com/${REPOSITORY}/actions/runs/${RUN_ID})"
            echo ""
            echo "**Commit:** \`${COMMIT_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"
