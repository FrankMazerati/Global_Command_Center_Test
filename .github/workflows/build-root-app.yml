name: Build 003 - Global Command Center
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install
      - name: Apply repository formatting
        run: bun run lint -- --fix
      - name: Lint
        run: bun run lint
      - name: Tests
        run: bun run test
      - name: Production build
        run: bun run build
