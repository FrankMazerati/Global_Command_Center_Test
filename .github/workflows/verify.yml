name: Verify Command Center

on:
  push:
    branches:
      - feature/enterprise-workspace-chat-buddy-build
      - fix/intellibase-knowledge-connectivity-2026-11-14
  pull_request:
    branches:
      - feature/enterprise-workspace-chat-buddy-build
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Targeted lint, tests, and production build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable the pinned package manager
        run: |
          corepack enable
          corepack prepare pnpm@11.25.0 --activate
          pnpm --version

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Record repository lint baseline
        run: pnpm lint
        continue-on-error: true

      - name: Format repaired source files
        run: |
          pnpm exec prettier --write \
            src/components/workspace/IntegrationOperationsWorkspaces.tsx \
            src/components/workspace/KnowledgeAndHelpWorkspaces.tsx \
            'src/routes/m.$section.$group.$page.tsx'

      - name: Commit formatting changes on the repair branch
        if: github.event_name == 'push' && github.ref_name == 'fix/intellibase-knowledge-connectivity-2026-11-14'
        run: |
          if ! git diff --quiet -- \
            src/components/workspace/IntegrationOperationsWorkspaces.tsx \
            src/components/workspace/KnowledgeAndHelpWorkspaces.tsx \
            'src/routes/m.$section.$group.$page.tsx'; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add \
              src/components/workspace/IntegrationOperationsWorkspaces.tsx \
              src/components/workspace/KnowledgeAndHelpWorkspaces.tsx \
              'src/routes/m.$section.$group.$page.tsx'
            git commit -m "Format repaired source files [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Lint repaired source files
        run: |
          pnpm exec eslint \
            src/components/workspace/IntegrationOperationsWorkspaces.tsx \
            src/components/workspace/KnowledgeAndHelpWorkspaces.tsx \
            'src/routes/m.$section.$group.$page.tsx'

      - name: Run available tests
        run: pnpm test --passWithNoTests

      - name: Build application
        run: pnpm build

      - name: Preserve formatted source for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: formatted-repair-source
          path: |
            src/components/workspace/IntegrationOperationsWorkspaces.tsx
            src/components/workspace/KnowledgeAndHelpWorkspaces.tsx
            src/routes/m.$section.$group.$page.tsx
          if-no-files-found: error
          retention-days: 1
