name: Verify Command Center

on:
  push:
    branches:
      - feature/enterprise-workspace-chat-buddy-build
      - fix/intellibase-knowledge-connectivity-2026-11-14
  pull_request:
    branches:
      - feature/enterprise-workspace-chat-buddy-build
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable the pinned package manager
        run: |
          corepack enable
          corepack prepare pnpm@11.25.0 --activate
          pnpm --version

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Run available tests
        run: pnpm test --passWithNoTests

      - name: Build application
        run: pnpm build
