name: Verify Command Center

on:
  push:
    branches:
      - feature/enterprise-workspace-chat-buddy-build
      - fix/intellibase-knowledge-connectivity-2026-11-14
  pull_request:
    branches:
      - feature/enterprise-workspace-chat-buddy-build
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Targeted lint, tests, and production build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable the pinned package manager
        run: |
          corepack enable
          corepack prepare pnpm@11.25.0 --activate
          pnpm --version

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Record existing repository-wide lint baseline
        run: pnpm lint
        continue-on-error: true

      - name: Format the new integration workspace
        run: pnpm exec prettier --write src/components/workspace/IntegrationOperationsWorkspaces.tsx

      - name: Lint the new integration workspace
        run: pnpm exec eslint src/components/workspace/IntegrationOperationsWorkspaces.tsx

      - name: Run available tests
        run: pnpm test --passWithNoTests

      - name: Build application
        run: pnpm build

      - name: Preserve formatted source for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: formatted-integration-workspace
          path: src/components/workspace/IntegrationOperationsWorkspaces.tsx
          if-no-files-found: error
          retention-days: 1
