name: IntelliCalendar foundation checks

on:
  push:
    branches:
      - feature/intellicalendar-foundation
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: intellicalendar-foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, test, and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: "pnpm exec eslint . --rule 'prettier/prettier: off'"

      - name: Unit tests
        run: pnpm test

      - name: Production build
        run: pnpm build
