name: Responsive Layout QA

on:
  push:
    branches:
      - fix/compact-responsive-layout
  pull_request:
    branches:
      - main
    paths:
      - "src/routes/index.tsx"
      - "src/styles.css"
      - "package.json"
      - "bun.lock*"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install
      - name: Lint
        run: "bun run lint"
      - name: Tests
        run: "bun run test"
      - name: Production build
        run: "bun run build"
      - name: Check formatting drift
        run: "bunx prettier --check ."
