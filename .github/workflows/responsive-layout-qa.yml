name: Responsive Layout QA

on:
  push:
    branches:
      - fix/compact-responsive-layout
  pull_request:
    branches:
      - main
    paths:
      - "src/routes/index.tsx"
      - "src/styles.css"
      - "package.json"
      - "pnpm-lock.yaml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint dashboard entry point
        run: pnpm exec eslint src/routes/index.tsx
      - name: Tests
        run: pnpm test
      - name: Production build
        run: pnpm build
